<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Placeholder PH sign-in log sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <text x="40" y="40" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PLACEHOLDER · SWAP WITH REAL PHOTO</text>
  <rect x="50" y="70" width="800" height="440" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="800">EVENT SIGN-IN SHEET</text>
  <text x="450" y="135" text-anchor="middle" fill="#92400e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Manila Trade Show · Sample</text>
  <!-- header row -->
  <rect x="80" y="160" width="740" height="36" fill="#fef3c7" stroke="#d97706"/>
  <text x="95" y="183" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">NAME</text>
  <text x="250" y="183" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">COMPANY</text>
  <text x="430" y="183" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">PHONE</text>
  <text x="580" y="183" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">EMAIL</text>
  <text x="730" y="183" fill="#78350f" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">NOTES</text>
  <!-- rows -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#1c1917">
    <line x1="80" y1="230" x2="820" y2="230" stroke="#fbbf24"/>
    <text x="95" y="220">Maria Santos</text>
    <text x="250" y="220">Acme Corp</text>
    <text x="430" y="220">+63 917 555&</text>
    <text x="580" y="220">maria@acme&</text>
    <text x="730" y="220">Booth</text>
    <line x1="80" y1="280" x2="820" y2="280" stroke="#fbbf24"/>
    <text x="95" y="270">Dr. John Lee</text>
    <text x="250" y="270">Health First</text>
    <text x="430" y="270">02-8888&</text>
    <text x="580" y="270">jlee@hf.ph</text>
    <text x="730" y="270"></text>
    <line x1="80" y1="330" x2="820" y2="330" stroke="#fbbf24"/>
    <text x="95" y="320">Ana Reyes</text>
    <text x="250" y="310">KINMO PW</text>
    <text x="250" y="325" font-size="9">CORPORATION</text>
    <text x="430" y="320">0918-777&</text>
    <text x="580" y="320">ana@kinmo&</text>
    <text x="730" y="320">Follow up</text>
    <line x1="80" y1="380" x2="820" y2="380" stroke="#fbbf24" stroke-dasharray="4 4"/>
    <line x1="80" y1="430" x2="820" y2="430" stroke="#fbbf24" stroke-dasharray="4 4"/>
  </g>
  <text x="450" y="480" text-anchor="middle" fill="#b45309" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Printed tabular sheet · 3 sample rows</text>
</svg>
