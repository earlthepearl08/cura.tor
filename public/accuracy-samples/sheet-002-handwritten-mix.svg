<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Placeholder handwritten log sheet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <text x="40" y="40" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="2">PLACEHOLDER · SWAP WITH REAL PHOTO</text>
  <rect x="50" y="70" width="800" height="440" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" fill="#44403c" font-family="Georgia,serif" font-size="22" font-weight="700">Visitor Log</text>
  <text x="450" y="135" text-anchor="middle" fill="#78716c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Handwritten mix · illustrative</text>
  <rect x="80" y="160" width="740" height="32" fill="#e7e5e4"/>
  <text x="95" y="181" fill="#57534e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">NAME</text>
  <text x="280" y="181" fill="#57534e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">COMPANY</text>
  <text x="480" y="181" fill="#57534e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">PHONE</text>
  <text x="650" y="181" fill="#57534e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700">NOTES</text>
  <!-- faux handwriting with italic -->
  <g font-family="Georgia, 'Comic Sans MS', cursive" font-size="15" fill="#1c1917" font-style="italic">
    <line x1="80" y1="240" x2="820" y2="240" stroke="#d6d3d1"/>
    <text x="95" y="225">Carlo Mendoza</text>
    <text x="280" y="225">Bright Solar PH</text>
    <text x="480" y="225">0917-111-2222</text>
    <text x="650" y="225">wants quote</text>
    <line x1="80" y1="300" x2="820" y2="300" stroke="#d6d3d1"/>
    <text x="95" y="285">Liza Cruz</text>
    <text x="280" y="285">Metro Builders Co.</text>
    <text x="480" y="285">02-8123-4567</text>
    <text x="650" y="285" fill="#a8a29e"></text>
    <line x1="80" y1="360" x2="820" y2="360" stroke="#d6d3d1" stroke-dasharray="3 3"/>
    <line x1="80" y1="420" x2="820" y2="420" stroke="#d6d3d1" stroke-dasharray="3 3"/>
  </g>
  <text x="450" y="480" text-anchor="middle" fill="#78716c" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">Partial fields · empty cells stay empty</text>
</svg>
