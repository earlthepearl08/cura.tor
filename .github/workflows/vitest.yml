name: Vitest

# Unit / critical-path suite — mocked APIs (no live Gemini/Stripe/Firebase).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: vitest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
        env:
          CI: true
