# Advisory Lighthouse against public Landing (/)
# Soft budgets from TECHNICAL_SPEC.md §8.
# This check is always green: budget misses are logged as ::warning:: annotations only.
name: Lighthouse (advisory)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'lighthouserc.cjs'
      - 'docs/lighthouse.md'
      - 'scripts/lighthouse-advisory.sh'
      - '.github/workflows/lighthouse-advisory.yml'

concurrency:
  group: lighthouse-advisory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Landing budgets (warn-only)
    runs-on: ubuntu-latest
    # Do NOT use continue-on-error — that still marks the check red.
    # Steps below always exit 0; budget misses become annotations.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Collect + advisory assert (always green)
        run: bash scripts/lighthouse-advisory.sh

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
